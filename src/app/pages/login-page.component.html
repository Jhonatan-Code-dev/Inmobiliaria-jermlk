<main
  class="min-h-screen grid place-items-center p-4 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">
  <section
    class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-8 sm:p-10 shadow-2xl border border-slate-200 dark:border-slate-800 transition-colors duration-300 relative overflow-hidden">

    <!-- Background Decorator -->
    <div
      class="absolute -top-24 -right-24 h-64 w-64 rounded-full bg-primary-100 dark:bg-primary-900/20 blur-3xl opacity-60 pointer-events-none transition-colors">
    </div>
    <div
      class="absolute -bottom-24 -left-24 h-64 w-64 rounded-full bg-indigo-50 dark:bg-indigo-900/10 blur-3xl opacity-60 pointer-events-none transition-colors">
    </div>

    <div class="relative z-10 flex flex-col items-center text-center mb-10">
      <div
        class="h-14 w-14 bg-primary-600 dark:bg-primary-500 text-white rounded-2xl flex items-center justify-center mb-8 shadow-xl shadow-primary-500/30 ring-4 ring-primary-50 dark:ring-primary-900/20">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" class="h-7 w-7">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
      </div>
      <p class="text-[10px] font-black uppercase tracking-[0.2em] text-primary-600 dark:text-primary-400 mb-2">Portal de
        Administración</p>
      <h2 class="text-4xl font-black tracking-tighter text-slate-900 dark:text-white transition-colors">Bienvenido</h2>
    </div>

    <p
      class="relative z-10 text-sm font-medium text-slate-500 dark:text-slate-400 mb-10 text-center leading-relaxed transition-colors">
      Ingresa tus credenciales para gestionar tu <span
        class="font-bold text-slate-900 dark:text-white">Inmobiliaria</span>.
    </p>

    @if (error) {
    <div
      class="relative z-10 mb-8 p-5 rounded-2xl bg-rose-50 dark:bg-rose-950/20 border border-rose-100 dark:border-rose-900/50 text-xs font-bold text-rose-700 dark:text-rose-400 flex items-center gap-4 animate-zoom shadow-sm"
      role="alert">
      <div class="h-8 w-8 rounded-full bg-rose-100 dark:bg-rose-900/50 flex items-center justify-center shrink-0">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="3">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <span>{{ error }}</span>
    </div>
    }

    <form class="relative z-10 space-y-7" [formGroup]="loginForm" (ngSubmit)="submit()">
      <div class="space-y-2">
        <label
          class="block text-[10px] font-black uppercase tracking-widest text-slate-500 dark:text-slate-400 ml-1">Usuario</label>
        <div class="relative group">
          <input type="text" formControlName="username" [disabled]="isLoading" autocomplete="username"
            placeholder="Ej: admin01" required
            class="w-full h-14 px-5 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-all text-sm font-bold disabled:opacity-50" />
          <div
            class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-primary-500 transition-colors">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
        </div>
      </div>

      <div class="space-y-2">
        <div class="flex items-center justify-between ml-1">
          <label
            class="block text-[10px] font-black uppercase tracking-widest text-slate-500 dark:text-slate-400">Contraseña</label>
          <button type="button"
            class="text-[10px] font-black uppercase tracking-widest text-primary-600 dark:text-primary-400 hover:text-primary-700 transition-colors"
            (click)="togglePassword()">
            {{ showPassword ? 'Ocultar' : 'Revelar' }}
          </button>
        </div>
        <div class="relative group">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" [disabled]="isLoading"
            autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required
            class="w-full h-14 px-5 rounded-2xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition-all text-sm font-bold disabled:opacity-50" />
          <div
            class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-300 group-focus-within:text-primary-500 transition-colors">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </div>
        </div>
      </div>

      <button
        class="w-full h-14 rounded-2xl bg-primary-600 dark:bg-primary-500 text-white font-black uppercase tracking-[0.2em] text-[10px] hover:bg-primary-700 dark:hover:bg-primary-400 transition-all shadow-xl shadow-primary-500/20 active:scale-[0.97] disabled:opacity-50 flex items-center justify-center gap-3 mt-4"
        type="submit" [disabled]="isLoading">
        @if(isLoading) {
        <svg class="animate-spin h-5 w-5 text-current" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        <span>Sincronizando...</span>
        } @else {
        <span>Acceder al Panel</span>
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
        }
      </button>
    </form>

    <div
      class="relative z-10 mt-12 pt-8 border-t border-slate-100 dark:border-slate-800 flex flex-col items-center text-center space-y-3 transition-colors">
      <span class="text-[9px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-[0.3em]">Sistema de
        Gestión Inmobiliaria v1.0</span>
      <div class="flex items-center gap-2">
        <div class="h-1 w-1 rounded-full bg-emerald-500 animate-pulse"></div>
        <small class="text-[10px] font-bold text-slate-500 dark:text-slate-400">&copy; 2026 Inmobiliaria V1. Todos los
          derechos reservados.</small>
      </div>
      <div class="flex items-center justify-center gap-4 mt-2">
        <a routerLink="/libro-reclamaciones" class="group inline-flex items-center gap-1.5 text-[10px] font-bold text-indigo-600 dark:text-indigo-400 hover:underline">
          <svg class="h-4 w-4 text-indigo-500 group-hover:rotate-6 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
          Libro de Reclamaciones
        </a>
        <span class="text-slate-300 dark:text-slate-700">|</span>
        <a routerLink="/manual-usuario" class="group inline-flex items-center gap-1.5 text-[10px] font-bold text-indigo-600 dark:text-indigo-400 hover:underline">
          <svg class="h-4 w-4 text-indigo-500 group-hover:scale-110 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
          </svg>
          Manual & Ayuda
        </a>
      </div>
    </div>
  </section>
</main>
